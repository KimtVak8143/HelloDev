name: Build, Testing, Linting

on:
  push:
    branches: [develop, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node 22.22.0
        uses: actions/setup-node@v3
        with:
          node-version: 22.22.0
      - name: Install dependencies
        run: npm install
      - name: Lint check
        run: npm run lint
      - name: Build check
        run: npm run build
      - name: Run tests
        run: npm test      